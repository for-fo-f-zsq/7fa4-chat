<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoGebra</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    #ggb-element { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="ggb-element"></div>
  <script src="deployggb.js"></script>
  <script>
    var params = {
      "appName": "geometry",
      "width": 800,
      "height": 600,
      "showToolBar": true,
      "showAlgebraInput": true,
      "showMenuBar": true,
      "showResetIcon": true,
      "enableRightClick": true,
      "language": "zh"
    };
    var applet = new GGBApplet(params, true);
    var ggb = null;
    var lastW = 0;
    var lastH = 0;
    var resizeTimer = null;

    function getViewportSize() {
      var docEl = document.documentElement;
      var w = (docEl && docEl.clientWidth) || window.innerWidth || 0;
      var h = (docEl && docEl.clientHeight) || window.innerHeight || 0;
      return { w: Math.round(w), h: Math.round(h) };
    }

    // 仅在视口真实宽高发生变化（或显式 force）时调用 ggb.setSize；
    // 禁止在此处再次派发 window resize，以免造成递归事件风暴与点击代数区闪烁。
    function fillViewport(force) {
      try {
        if (!ggb || !ggb.setSize) return false;
        var vp = getViewportSize();
        if (vp.w <= 0 || vp.h <= 0) return false;
        if (!force && vp.w === lastW && vp.h === lastH) return false;
        lastW = vp.w;
        lastH = vp.h;
        ggb.setSize(vp.w, vp.h);
        return true;
      } catch (e) { return false; }
    }

    function scheduleFillViewport() {
      var vp = getViewportSize();
      if (vp.w <= 0 || vp.h <= 0) return;
      if (vp.w === lastW && vp.h === lastH) return;
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        resizeTimer = null;
        fillViewport(false);
      }, 60);
    }

    // 外层窗口或视口容器尺寸变化（不监听 #ggb-element 内部 DOM 变动，避免代数区交互触发重绘）
    window.addEventListener("resize", scheduleFillViewport);
    if (typeof ResizeObserver !== "undefined" && document.documentElement) {
      try {
        new ResizeObserver(scheduleFillViewport).observe(document.documentElement);
      } catch (e) { /* ignore */ }
    }

    // 用外层 GeoGebra 容器实际尺寸判断是否已铺满视口（兼容代数区展开时 canvas 宽度小于视口的情况）
    function isFilled() {
      try {
        var vp = getViewportSize();
        if (vp.w <= 0 || vp.h <= 0) return false;
        var frame = document.querySelector("#ggb-element .GeoGebraFrame") ||
                    document.querySelector("#ggb-element .applet_scaler") ||
                    document.querySelector("#ggb-element > div");
        if (frame) {
          var rect = frame.getBoundingClientRect();
          if (Math.abs(rect.width - vp.w) < 4 && Math.abs(rect.height - vp.h) < 4) {
            return true;
          }
        }
        var cv = document.querySelector("#ggb-element canvas");
        return !!(cv && Math.abs(cv.clientWidth - vp.w) < 4 && Math.abs(cv.clientHeight - vp.h) < 4);
      } catch (e) { return false; }
    }

    window.addEventListener("load", function () {
      applet.setHTML5Codebase("HTML5/5.0/web/");
      applet.inject("ggb-element");
      var tries = 0;
      var timer = setInterval(function () {
        tries++;
        try {
          ggb = applet.getAppletObject();
          if (ggb && ggb.setSize) {
            clearInterval(timer);
            fillViewport(true);
            var settle = setInterval(function () {
              if (isFilled()) {
                clearInterval(settle);
                return;
              }
              fillViewport(true);
              if (isFilled()) clearInterval(settle);
            }, 200);
            setTimeout(function () { clearInterval(settle); }, 6000);
            try { ggb.setAxesVisible(1, true); } catch (e) {}
            try { ggb.setGridVisible(true); } catch (e) {}
          }
        } catch (e) { /* not ready */ }
        if (tries > 100) clearInterval(timer);
      }, 100);
    });
  </script>
</body>
</html>
