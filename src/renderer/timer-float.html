<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>计时器悬浮窗</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%;
        /* 高度不写死：窗口高度由本页实测内容高度后请主进程调整（有几个格就多高） */
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        user-select: none; -webkit-user-select: none;
    }
    /* 半透明卡片：桌面能明显透出来，仍留一点底色保证文字可读 */
    #root {
        width: 100%;
        display: flex; flex-direction: column;
        background: rgba(24, 26, 32, 0.34);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        color: #FFFFFF;
        /* ⚠️ 卡片是 0.34 透明的：桌面一亮（白底窗口/浅色壁纸）文字就没了对比度，
           只靠底色救不回来（0.34 的深色叠在白底上仍是浅灰）。所以用「字幕式」暗色描边阴影兜底。 */
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 1px rgba(0, 0, 0, 0.95);
        overflow: hidden;
    }
    #bar {
        display: flex; align-items: center; gap: 6px;
        padding: 6px 8px 5px 10px;
        /* 整个标题栏可拖拽移动窗口（frameless 窗口靠 CSS 拖拽） */
        -webkit-app-region: drag;
        flex: none;
    }
    #bar .ico { font-size: 12px; color: #8AB4F8; }
    #title { font-size: 12px; font-weight: 600; letter-spacing: 0.3px; }
    #state { font-size: 10.5px; color: #C7CDD8; margin-left: 2px; }
    #bar .spacer { flex: 1; }
    .bar-btn {
        -webkit-app-region: no-drag;
        width: 20px; height: 20px; border-radius: 6px; border: none;
        background: rgba(255, 255, 255, 0.08); color: #D6DAE3;
        cursor: pointer; font-size: 11px; line-height: 1;
        display: grid; place-items: center; padding: 0;
    }
    .bar-btn:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }
    #close:hover { background: #E5484D; color: #fff; }

    #list { flex: none; padding: 0 9px 4px; }
    .row { padding: 4px 0 5px; }
    .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .row-top { display: flex; align-items: center; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); }
    .name {
        font-size: 11.5px; color: #F2F5FA; flex: 1; min-width: 0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .time {
        font-size: 17px; font-weight: 600; letter-spacing: 0.4px;
        font-variant-numeric: tabular-nums; flex: none;
    }
    /* 每格自己的开始/暂停：图标用纯 CSS 画，字体里缺 ▶/⏸ 也不会变豆腐块 */
    .pp {
        -webkit-app-region: no-drag;
        flex: none; width: 22px; height: 22px; border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.14); color: #F2F4F8;
        display: grid; place-items: center; padding: 0; cursor: pointer;
    }
    .pp:hover { background: rgba(255, 255, 255, 0.32); }
    .pp .ic { display: block; }
    .pp.play .ic {
        width: 0; height: 0; margin-left: 2px; border-style: solid;
        border-width: 5px 0 5px 8px;
        border-color: transparent transparent transparent currentColor;
    }
    .pp.pause .ic {
        width: 8px; height: 10px;
        border-left: 2px solid currentColor; border-right: 2px solid currentColor;
    }
    .bar { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); margin-top: 3px; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 2px; transition: width 0.25s linear; }
    .run  .time { color: #FFFFFF; }
    .idle .time { color: #9AA2B1; }
    .done .time { color: #FF9F43; }

    #empty { flex: none; padding: 18px 14px 20px; color: #C4CAD4; font-size: 11.5px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
    <div id="root">
        <div id="bar">
            <span class="ico">⏱</span>
            <span id="title">计时器</span>
            <span id="state"></span>
            <span class="spacer"></span>
            <button class="bar-btn" id="pin" title="切换置顶">📌</button>
            <button class="bar-btn" id="close" title="关闭悬浮窗">✕</button>
        </div>
        <div id="list"></div>
        <div id="empty" style="display:none">还没有正在计时的格<br>在主窗口里选人/填名字后这里会显示</div>
    </div>
    <script>
    (function () {
        var rootEl = document.getElementById('root');
        var listEl = document.getElementById('list');
        var emptyEl = document.getElementById('empty');
        var stateEl = document.getElementById('state');
        var pinBtn = document.getElementById('pin');
        var closeBtn = document.getElementById('close');

        // 由主窗口推来的完整状态（不在本窗口持久化，保持单一数据源）
        var state = { layout: 4, panels: [] };
        var tickId = null;
        var lastH = 0;
        // 行节点常驻（不每帧重建），structSig 变了才重建 —— 见 render() 的说明
        var rowEls = [];
        var structSig = '';

        function pad(n) { return String(n).padStart(2, '0'); }
        function fmt(ms) {
            var total = Math.max(0, Math.ceil((ms || 0) / 1000));
            var h = Math.floor(total / 3600);
            var m = Math.floor((total % 3600) / 60);
            var s = total % 60;
            return pad(h) + ':' + pad(m) + ':' + pad(s);
        }
        // 运行中按本地时钟从 deadline 反推剩余（主窗口不必每 100ms 推送）
        function remainOf(p, now) {
            if (p && p.running && p.deadline) return Math.max(0, p.deadline - now);
            return Math.max(0, p && p.remaining || 0);
        }
        function pctOf(p, rem) {
            var total = p && p.total || 0;
            if (!total || total <= 0) return 0;
            var used = Math.min(1, Math.max(0, 1 - rem / total));
            return +(used * 100).toFixed(2);
        }

        // 窗口高度 = 内容高度（几个格就多高）→ 请主进程调整窗口尺寸
        function reportSize() {
            var h = Math.ceil(rootEl.getBoundingClientRect().height);
            if (!h || Math.abs(h - lastH) < 1) return;
            lastH = h;
            if (window.timerFloat && window.timerFloat.resize) window.timerFloat.resize(h);
        }

        // 行内身份：「姓名-任务」（没填任务就只显示名字；过长由 .name 的 ellipsis 省略）
        function labelOf(p) {
            return p.task ? ((p.name || '未命名') + '-' + p.task) : (p.name || '未命名');
        }

        // 结构签名：行数 / 身份 / 颜色 / 下标 —— 只有它变了才重建行。
        // ⚠️ 不能每帧 innerHTML 重建：按钮会在 mousedown 与 mouseup 之间被换掉，
        //    连点时 click 收不到，看起来「卡住」（2026-10-10 用户报「连点可能卡住」）。
        function structSigOf(panels) {
            var parts = [];
            for (var i = 0; i < panels.length; i++) {
                var p = panels[i];
                parts.push([p.index == null ? '' : p.index, labelOf(p), p.color || ''].join('\u0001'));
            }
            return parts.join('\u0002');
        }

        function buildRow(p, i) {
            var color = p.color || '#3C8CE7';
            var el = document.createElement('div');
            var top = document.createElement('div');
            top.className = 'row-top';
            var dot = document.createElement('span');
            dot.className = 'dot';
            dot.style.background = color;
            var name = document.createElement('span');
            name.className = 'name';
            name.textContent = labelOf(p);
            var time = document.createElement('span');
            time.className = 'time';
            var btn = document.createElement('button');
            btn.className = 'pp';
            // data-i 是它在主窗口面板数组里的下标（不是本列表的位置），点击时原样回传
            btn.setAttribute('data-i', String(p.index == null ? i : p.index));
            var ic = document.createElement('span');
            ic.className = 'ic';
            btn.appendChild(ic);
            top.appendChild(dot); top.appendChild(name); top.appendChild(time); top.appendChild(btn);
            var bar = document.createElement('div');
            bar.className = 'bar';
            var fill = document.createElement('i');
            fill.style.background = color;
            bar.appendChild(fill);
            el.appendChild(top); el.appendChild(bar);
            return el;
        }

        // 每帧只改「会变的东西」（时间 / 进度 / 图标），DOM 节点保持不变
        function paintRow(el, p, now) {
            var rem = remainOf(p, now);
            var cls = 'row ' + (p.done ? 'done' : (p.running ? 'run' : 'idle'));
            if (el.className !== cls) el.className = cls;
            var time = el.querySelector('.time');
            if (time) time.textContent = fmt(rem);
            var fill = el.querySelector('.bar > i');
            if (fill) fill.style.width = pctOf(p, rem) + '%';
            var btn = el.querySelector('.pp');
            if (btn) {
                var bcls = 'pp ' + (p.running ? 'pause' : 'play');
                if (btn.className !== bcls) {
                    btn.className = bcls;
                    btn.title = p.running ? '暂停' : '开始';
                }
            }
        }

        function render() {
            var now = Date.now();
            // 只按「显示格数」截取：选了 4 格就显示 4 行（没选人的格子显示「未选择」）
            var panels = (state.panels || []).slice(0, state.layout || 4)
                .filter(function (p) { return p; });

            stateEl.textContent = panels.length ? panels.length + ' 格' : '';

            if (!panels.length) {
                listEl.style.display = 'none';
                emptyEl.style.display = '';
                if (structSig !== 'empty') {
                    structSig = 'empty';
                    rowEls = [];
                    listEl.innerHTML = '';
                }
                reportSize();
                return;
            }
            listEl.style.display = '';
            emptyEl.style.display = 'none';

            var sig = structSigOf(panels);
            var rebuilt = sig !== structSig;
            if (rebuilt) {
                structSig = sig;
                rowEls = [];
                var frag = document.createDocumentFragment();
                for (var k = 0; k < panels.length; k++) {
                    var row = buildRow(panels[k], k);
                    rowEls.push(row);
                    frag.appendChild(row);
                }
                listEl.innerHTML = '';
                listEl.appendChild(frag);
            }

            for (var i = 0; i < panels.length; i++) paintRow(rowEls[i], panels[i], now);
            // ⚠️ 量高度必须在 fill 之后：buildRow 出来的是空 <span class="time">，
            //    先量会偏小（实测 1 格量到 65、填完才 74），窗口就矮一截。
            if (rebuilt) reportSize();
        }

        function syncTick() {
            var anyRunning = (state.panels || []).some(function (p) { return p && p.running; });
            if (anyRunning && !tickId) {
                tickId = setInterval(render, 250);
            } else if (!anyRunning && tickId) {
                clearInterval(tickId); tickId = null;
            }
        }

        function applyState(s) {
            if (s) state = s;
            render();
            syncTick();
        }

        if (window.timerFloat) {
            window.timerFloat.onState(applyState);
            window.timerFloat.onConfig(function (cfg) {
                pinBtn.style.opacity = cfg && cfg.onTop === false ? 0.45 : 1;
            });
        }

        // 每格自己的开始/暂停：用 pointerdown（按下即响应，不等 mouseup），
        // 配合「行节点常驻」的方案，连点也不会丢事件。列表重建过也照样接得到（委托在 #list 上）。
        listEl.addEventListener('pointerdown', function (e) {
            if (e.button !== 0) return;
            var btn = e.target && e.target.closest ? e.target.closest('.pp') : null;
            if (!btn || !window.timerFloat) return;
            var i = Number(btn.getAttribute('data-i'));
            if (Number.isFinite(i)) window.timerFloat.command({ type: 'toggle-one', index: i });
        });
        pinBtn.addEventListener('click', function () {
            window.timerFloat && window.timerFloat.command({ type: 'toggle-pin' });
        });
        closeBtn.addEventListener('click', function () {
            window.timerFloat && window.timerFloat.command({ type: 'close' });
        });

        render();
        // 字体/字体图标加载完成后高度可能变一点，补测一次
        window.addEventListener('load', reportSize);
        setTimeout(reportSize, 120);
    })();
    </script>
</body>
</html>
