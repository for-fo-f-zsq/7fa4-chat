<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-app, #ffffff);
      color: var(--text-primary, #1f2328);
      font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
    }
    #tool-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-app, #ffffff);
    }
    #tool-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg-app, #ffffff);
      color-scheme: normal;
    }
    .tool-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: var(--bg-app, #ffffff);
      color: var(--text-secondary, #656d76);
      font-size: 14px;
      text-align: center;
    }
    .tool-overlay[hidden] { display: none; }
    .tool-spinner {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2.5px solid var(--border-light, #d0d7de);
      border-top-color: var(--accent, #2f81f7);
      animation: tool-spin 0.8s linear infinite;
    }
    @keyframes tool-spin { to { transform: rotate(360deg); } }
    .tool-retry-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-light, #d0d7de);
      background: var(--bg-input, #f6f8fa);
      color: var(--text-primary, #1f2328);
      font-size: 13px;
      cursor: pointer;
    }
    .tool-retry-btn:hover {
      background: var(--bg-sidebar-hover, #eaeef2);
    }
  </style>
</head>
<body>
  <div id="tool-root">
    <iframe
      id="tool-frame"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"
      referrerpolicy="no-referrer"
      allow="clipboard-read; clipboard-write"
    ></iframe>

    <div id="tool-loading" class="tool-overlay">
      <div class="tool-spinner" aria-hidden="true"></div>
      <span>工具加载中…</span>
    </div>

    <div id="tool-error" class="tool-overlay" hidden>
      <div id="tool-error-msg">工具加载失败</div>
      <button id="tool-retry" class="tool-retry-btn" type="button">重试</button>
    </div>
  </div>
  <script type="module" src="/src/tool-window-main.js"></script>
</body>
</html>
