<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>站点通知</title>
<style>
  :root {
    --sn-bg: #FBFCFE;
    --sn-border: #DBE1E8;
    --sn-fg: #24324A;
    --sn-fg-muted: #5F7089;
    --sn-accent: #7C9CD0;
    --sn-accent-hover: #7292C8;
    --sn-accent-soft: rgba(124, 156, 208, 0.14);
    --sn-accent-line: rgba(124, 156, 208, 0.38);
    --sn-on-accent: #1F2C42;
    --sn-link: #4B73A6;
    --sn-sec-bg: #F2F5F9;
    --sn-sec-hover: #E8EDF3;
    --sn-warn-bg: rgba(245, 158, 11, 0.14);
    --sn-warn-fg: #9A6200;
    --sn-warn-line: rgba(245, 158, 11, 0.35);
    --sn-err-bg: rgba(220, 38, 38, 0.10);
    --sn-err-fg: #A35E56;
    --sn-err-line: rgba(220, 38, 38, 0.28);
    --sn-scroll: rgba(36, 50, 74, 0.22);
    --sn-shadow: 0 10px 28px rgba(15, 23, 42, 0.14);
  }
  :root[data-dark="1"] {
    --sn-bg: #141F34;
    --sn-border: #24324C;
    --sn-fg: #E6ECF5;
    --sn-fg-muted: #A9B8CE;
    --sn-accent: #7C9CC4;
    --sn-accent-hover: #8CAAD0;
    --sn-accent-soft: rgba(124, 156, 196, 0.18);
    --sn-accent-line: rgba(124, 156, 196, 0.38);
    --sn-on-accent: #101A2B;
    --sn-link: #8FB3DC;
    --sn-sec-bg: #1A2740;
    --sn-sec-hover: #223250;
    --sn-warn-bg: rgba(245, 158, 11, 0.20);
    --sn-warn-fg: #FCD34D;
    --sn-warn-line: rgba(245, 158, 11, 0.38);
    --sn-err-bg: rgba(239, 68, 68, 0.16);
    --sn-err-fg: #FCA5A5;
    --sn-err-line: rgba(239, 68, 68, 0.35);
    --sn-scroll: rgba(230, 236, 245, 0.24);
    --sn-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
    user-select: text;
  }
  #root {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--sn-bg);
    border: 1px solid var(--sn-accent-line, var(--sn-border));
    box-shadow: var(--sn-shadow);
    color: var(--sn-fg);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .icon {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--sn-accent-soft);
    color: var(--sn-link);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 700;
  }
  .title-wrap {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }
  .title {
    font-size: 14px;
    font-weight: 600;
    color: var(--sn-fg);
    white-space: nowrap;
  }
  .time {
    font-size: 11px;
    color: var(--sn-fg-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badges {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--sn-accent-soft);
    color: var(--sn-link);
    border: 1px solid var(--sn-accent-line);
    white-space: nowrap;
  }
  .badge.warn {
    background: var(--sn-warn-bg);
    color: var(--sn-warn-fg);
    border-color: var(--sn-warn-line);
  }
  .body {
    font-size: 13px;
    line-height: 1.55;
    color: var(--sn-fg);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 220px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .body::-webkit-scrollbar { width: 5px; }
  .body::-webkit-scrollbar-thumb {
    background: var(--sn-scroll);
    border-radius: 999px;
  }
  .body a {
    color: var(--sn-link);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .error {
    display: none;
    font-size: 11.5px;
    color: var(--sn-err-fg);
    background: var(--sn-err-bg);
    border: 1px solid var(--sn-err-line);
    border-radius: 6px;
    padding: 5px 8px;
  }
  .error.show { display: block; }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 2px;
  }
  .hint {
    font-size: 11px;
    color: var(--sn-fg-muted);
    white-space: nowrap;
  }
  .actions {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  button {
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 6px 11px;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.14s ease, opacity 0.14s ease, transform 0.1s ease;
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.58; cursor: not-allowed; }
  .btn-secondary {
    background: var(--sn-sec-bg);
    color: var(--sn-fg);
    border-color: var(--sn-border);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--sn-sec-hover); }
  .btn-primary {
    background: var(--sn-accent);
    color: var(--sn-on-accent);
    border-color: var(--sn-accent-line);
  }
  .btn-primary:hover:not(:disabled) { background: var(--sn-accent-hover); }
</style>
</head>
<body>
  <div id="root" role="alertdialog" aria-live="assertive" aria-label="系统通知">
    <div class="head">
      <span class="icon" aria-hidden="true">!</span>
      <div class="title-wrap">
        <span class="title">未读通知</span>
        <span id="time" class="time"></span>
      </div>
      <div class="badges">
        <span id="test-badge" class="badge warn" style="display: none;">测试</span>
        <span id="count-badge" class="badge" style="display: none;"></span>
      </div>
    </div>
    <div id="body" class="body"></div>
    <div id="error" class="error"></div>
    <div class="footer">
      <span class="hint">不定时关闭</span>
      <div class="actions">
        <button id="jump-btn" type="button" class="btn-secondary" style="display: none;">查看页面</button>
        <button id="check-btn" type="button" class="btn-secondary">确认</button>
        <button id="read-btn" type="button" class="btn-primary">已读</button>
      </div>
    </div>
  </div>
  <script>
  (function () {
    const rootEl = document.getElementById('root');
    const timeEl = document.getElementById('time');
    const testBadgeEl = document.getElementById('test-badge');
    const countBadgeEl = document.getElementById('count-badge');
    const bodyEl = document.getElementById('body');
    const errorEl = document.getElementById('error');
    const jumpBtn = document.getElementById('jump-btn');
    const checkBtn = document.getElementById('check-btn');
    const readBtn = document.getElementById('read-btn');

    let currentNotice = null;
    let lastReportedHeight = 0;

    function reportSize() {
      if (!window.siteNotice) return;
      const h = Math.ceil(rootEl.getBoundingClientRect().height || rootEl.offsetHeight || 0);
      if (h > 0 && h !== lastReportedHeight) {
        lastReportedHeight = h;
        window.siteNotice.resize(h);
      }
    }

    function applyTheme(theme) {
      if (!theme || typeof theme !== 'object') return;
      const doc = document.documentElement;
      doc.setAttribute('data-dark', theme.isDark ? '1' : '0');
      const map = {
        '--sn-bg': theme.bg,
        '--sn-border': theme.border,
        '--sn-fg': theme.fg,
        '--sn-fg-muted': theme.fgMuted,
        '--sn-accent': theme.accent,
        '--sn-accent-hover': theme.accentHover,
        '--sn-accent-soft': theme.accentSoft,
        '--sn-accent-line': theme.accentLine,
        '--sn-on-accent': theme.onAccent,
        '--sn-link': theme.link,
        '--sn-sec-bg': theme.secBg,
        '--sn-sec-hover': theme.secHover,
      };
      for (const k of Object.keys(map)) {
        if (map[k]) doc.style.setProperty(k, map[k]);
      }
    }

    function renderBody(segments) {
      bodyEl.textContent = '';
      if (!Array.isArray(segments)) return;
      for (let i = 0; i < segments.length; i++) {
        const seg = segments[i];
        if (!seg) continue;
        if (seg.type === 'link' && seg.url) {
          const a = document.createElement('a');
          a.textContent = String(seg.text || seg.url);
          a.href = '#';
          a.addEventListener('click', function (e) {
            e.preventDefault();
            window.siteNotice && window.siteNotice.openJump(seg.url);
          });
          bodyEl.appendChild(a);
        } else {
          bodyEl.appendChild(document.createTextNode(String(seg.text || '')));
        }
      }
    }

    function applyState(payload) {
      const data = payload || {};
      if (data.theme) applyTheme(data.theme);
      const notice = data.notice || null;
      currentNotice = notice;
      if (!notice) return;

      timeEl.textContent = notice.relTimeText || '';
      timeEl.title = notice.fullTimeText || '';
      testBadgeEl.style.display = notice.isTest ? '' : 'none';

      const total = Number(data.totalPending) || 0;
      if (total > 1) {
        countBadgeEl.textContent = '还有 ' + total + ' 条';
        countBadgeEl.style.display = '';
      } else {
        countBadgeEl.style.display = 'none';
      }

      renderBody(notice.segments);
      jumpBtn.style.display = notice.jumpHref ? '' : 'none';

      if (data.error) {
        errorEl.textContent = String(data.error);
        errorEl.classList.add('show');
      } else {
        errorEl.textContent = '';
        errorEl.classList.remove('show');
      }

      const checkedDone = Boolean(notice.checked);
      const checkPending = Boolean(data.checkPending);
      checkBtn.disabled = checkedDone || checkPending;
      checkBtn.textContent = checkPending ? '确认中…' : (checkedDone ? '已确认' : '确认');

      const readPending = Boolean(data.readPending);
      readBtn.disabled = readPending;
      readBtn.textContent = readPending ? '处理中…' : '已读';

      requestAnimationFrame(reportSize);
    }

    jumpBtn.addEventListener('click', function () {
      if (!currentNotice || !currentNotice.jumpHref || !window.siteNotice) return;
      window.siteNotice.openJump(currentNotice.jumpHref);
    });

    checkBtn.addEventListener('click', function () {
      if (!currentNotice || !window.siteNotice) return;
      window.siteNotice.confirmCheck(currentNotice.id);
    });

    readBtn.addEventListener('click', function () {
      if (!currentNotice || !window.siteNotice) return;
      window.siteNotice.markRead(currentNotice.id);
    });

    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(function () { requestAnimationFrame(reportSize); }).observe(rootEl);
    }
    window.addEventListener('load', reportSize);

    if (window.siteNotice) {
      window.siteNotice.onState(applyState);
    }
  })();
  </script>
</body>
</html>
