<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#05060a" id="themeColorMeta" />
<title>意见反馈 · 7FA4 Chat</title>
<script>
(function () {
  var theme = null;
  try {
    var qp = new URLSearchParams(location.search).get('theme');
    if (qp === 'light' || qp === 'dark') {
      theme = qp;
    } else {
      var saved = localStorage.getItem('7fa4-site-theme');
      if (saved === 'light' || saved === 'dark') theme = saved;
    }
  } catch (e) {}
  if (!theme) {
    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', theme);
  var meta = document.getElementById('themeColorMeta');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f7fb' : '#05060a');
})();
</script>
<link id="faviconLink" rel="icon" type="image/png" href="../assets/icon.png" />
<link id="tokensCss" rel="stylesheet" href="../tokens.css" />
<script>
(function () {
  var base = location.pathname.replace(/\/feedback(?:\/(?:index\.html)?)?$/, '');
  var tok = document.getElementById('tokensCss');
  var fav = document.getElementById('faviconLink');
  try {
    if (tok && new URL(tok.getAttribute('href'), location.href).pathname !== base + '/tokens.css') {
      tok.href = base + '/tokens.css';
    }
    if (fav && new URL(fav.getAttribute('href'), location.href).pathname !== base + '/assets/icon.png') {
      fav.href = base + '/assets/icon.png';
    }
  } catch (e) {}
})();
</script>
<style>
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .fb-main {
    flex: 1;
    padding: 108px 0 64px;
  }

  .fb-intro {
    margin-bottom: 24px;
  }

  .fb-eyebrow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .fb-intro h1 {
    font-size: clamp(26px, 4vw, 34px);
    margin-bottom: 10px;
  }

  .fb-intro h1 .grad-text {
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .fb-sub {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.65;
  }

  .fb-card {
    padding: 28px;
  }

  .fb-field + .fb-field {
    margin-top: 22px;
  }

  .fb-label-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  .fb-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .fb-hint {
    font-weight: 400;
    font-size: 12.5px;
    color: var(--muted);
    margin-left: 8px;
  }

  .fb-count {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .fb-count.warn {
    color: var(--warn);
  }

  .fb-count.over {
    color: var(--danger);
    font-weight: 600;
  }

  textarea.field {
    min-height: 170px;
    resize: vertical;
    line-height: 1.68;
  }

  .fb-platforms {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .fb-plat {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 36px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--ink) 4%, transparent);
    color: var(--ink-soft);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    transition:
      border-color .18s var(--ease),
      background-color .18s var(--ease),
      color .18s var(--ease);
  }

  .fb-plat:hover {
    border-color: var(--line-strong);
    color: var(--ink);
    background: color-mix(in srgb, var(--ink) 8%, transparent);
  }

  .fb-plat input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    margin: 0;
    pointer-events: none;
  }

  .fb-plat-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--faint);
    transition: background-color .18s var(--ease), transform .18s var(--ease);
  }

  .fb-plat:has(input:checked) {
    border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--ink);
    font-weight: 600;
  }

  .fb-plat:has(input:checked) .fb-plat-dot {
    background: var(--accent-2);
    transform: scale(1.15);
  }

  .fb-plat:has(input:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .fb-dropzone {
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-sm);
    padding: 12px;
    background: color-mix(in srgb, var(--bg) 48%, transparent);
    transition: border-color .18s var(--ease), background-color .18s var(--ease);
  }

  .fb-dropzone.drag-over {
    border-color: var(--accent-2);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }

  .fb-shots {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .fb-shot {
    position: relative;
    width: 92px;
    height: 92px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    background: var(--panel-solid);
  }

  .fb-shot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: zoom-in;
  }

  .fb-shot-del {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 22px;
    height: 22px;
    border: 0;
    border-radius: 50%;
    background: rgba(5, 6, 10, 0.78);
    color: #fff;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color .15s var(--ease), transform .15s var(--ease);
  }

  .fb-shot-del:hover {
    background: var(--danger);
    transform: scale(1.06);
  }

  .fb-shot-add {
    width: 92px;
    height: 92px;
    border-radius: 12px;
    border: 1px dashed var(--line-strong);
    background: color-mix(in srgb, var(--ink) 4%, transparent);
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: border-color .18s var(--ease), color .18s var(--ease), background-color .18s var(--ease);
  }

  .fb-shot-add:hover {
    border-color: var(--accent);
    color: var(--ink);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }

  .fb-shot-add svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fb-drop-tip {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }

  .fb-drop-tip kbd,
  .fb-shortcut kbd {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 1px 5px;
    border-radius: 5px;
    background: color-mix(in srgb, var(--ink) 7%, transparent);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }

  .fb-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  .fb-shortcut {
    margin-left: auto;
    font-size: 12px;
    color: var(--faint);
  }

  .fb-msg {
    font-size: 13.5px;
    font-weight: 500;
    min-height: 20px;
  }

  .fb-msg.err { color: var(--danger); }
  .fb-msg.ok { color: var(--ok); }

  /* 提交成功态 */
  .fb-done {
    text-align: center;
    padding: 28px 12px 16px;
  }

  .fb-done-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--ok-soft);
    border: 1px solid var(--ok-line);
    color: var(--ok);
    display: grid;
    place-items: center;
  }

  .fb-done-icon svg {
    width: 28px;
    height: 28px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fb-done h2 {
    font-size: 22px;
    margin-bottom: 8px;
  }

  .fb-done p {
    color: var(--muted);
    font-size: 14.5px;
    max-width: 440px;
    margin: 0 auto 20px;
  }

  .fb-id-row {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 6px 14px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--ink) 5%, transparent);
    border: 1px solid var(--line);
    margin-bottom: 24px;
  }

  .fb-id-row span {
    font-size: 12.5px;
    color: var(--muted);
  }

  .fb-id-row code {
    background: transparent;
    border: 0;
    padding: 0;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
  }

  .fb-done-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  /* 截图灯箱预览 */
  .fb-zoom {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: rgba(5, 6, 10, 0.86);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }

  .fb-zoom img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 14px;
    box-shadow: 0 28px 70px rgba(0, 0, 0, .65);
    cursor: default;
  }

  .fb-zoom-close {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .24);
    background: rgba(13, 16, 25, .78);
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
  }

  .fb-zoom-close:hover {
    background: rgba(13, 16, 25, .96);
  }

  /* 页脚 */
  .fb-footer {
    border-top: 1px solid var(--line);
    padding: 24px 0 34px;
    color: var(--muted);
    font-size: 13.5px;
  }

  .fb-footer-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .fb-footer-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px;
  }

  .fb-footer-links a:hover {
    color: var(--ink);
  }

  @media (max-width: 640px) {
    .fb-main {
      padding: 88px 0 44px;
    }
    .fb-card {
      padding: 20px;
      border-radius: 18px;
    }
    .fb-shortcut {
      display: none;
    }
    .fb-actions .btn-primary {
      width: 100%;
    }
    .topbar-inner {
      padding: 8px 10px 8px 14px;
      gap: 10px;
    }
    .brand-tag {
      display: none;
    }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true">
  <span class="aurora-a"></span>
  <span class="aurora-b"></span>
  <span class="aurora-c"></span>
</div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="../" data-nav="home">
      <img class="brand-mark" id="brandIcon" src="../assets/icon.png" alt="7FA4 Chat" width="28" height="28" />
      <span class="brand-name">7FA4 <span class="brand-light">Chat</span></span>
      <span class="brand-tag">意见反馈</span>
    </a>
    <div class="topbar-side">
      <button type="button" class="icon-btn" id="themeToggle" aria-label="切换浅色/深色主题" title="切换主题">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
        </svg>
      </button>
      <a class="btn btn-ghost btn-sm" href="../" data-nav="home">返回官网</a>
    </div>
  </div>
</header>

<main class="fb-main">
  <div class="wrap-form">
    <div class="fb-intro">
      <div class="fb-eyebrow">
        <span class="tag tag-accent">意见反馈</span>
        <span class="tag" id="versionBadge" hidden></span>
      </div>
      <h1>把问题和想法<span class="grad-text">直接告诉我们</span></h1>
      <p class="fb-sub">遇到问题、想要新功能，都可以在这里说。截图可选，最多 3 张。</p>
    </div>

    <div class="glass-card fb-card" id="card">
      <form id="form" novalidate>
        <div class="fb-field">
          <div class="fb-label-row">
            <label class="fb-label" for="content">反馈内容 <span class="fb-hint">必填，最多 4000 字</span></label>
            <span class="fb-count" id="count">0/4000</span>
          </div>
          <textarea
            class="field"
            id="content"
            maxlength="4000"
            placeholder="描述你遇到的问题：做了什么、期望什么、实际发生了什么。能复现的步骤越具体越好。"
            required
          ></textarea>
        </div>

        <div class="fb-field">
          <div class="fb-label-row">
            <span class="fb-label">平台 <span class="fb-hint">会自动识别，可手动改</span></span>
          </div>
          <div class="fb-platforms" id="platforms" role="radiogroup" aria-label="平台">
            <label class="fb-plat"><input type="radio" name="platform" value="windows" /><span class="fb-plat-dot" aria-hidden="true"></span>Windows</label>
            <label class="fb-plat"><input type="radio" name="platform" value="linux" /><span class="fb-plat-dot" aria-hidden="true"></span>Linux</label>
            <label class="fb-plat"><input type="radio" name="platform" value="web" /><span class="fb-plat-dot" aria-hidden="true"></span>网页版</label>
            <label class="fb-plat"><input type="radio" name="platform" value="macos" /><span class="fb-plat-dot" aria-hidden="true"></span>macOS</label>
            <label class="fb-plat"><input type="radio" name="platform" value="android" /><span class="fb-plat-dot" aria-hidden="true"></span>Android</label>
            <label class="fb-plat"><input type="radio" name="platform" value="unknown" /><span class="fb-plat-dot" aria-hidden="true"></span>其它 / 不清楚</label>
          </div>
        </div>

        <div class="fb-field">
          <div class="fb-label-row">
            <span class="fb-label">截图 <span class="fb-hint">可选，最多 3 张，单张 ≤ 3MB</span></span>
          </div>
          <div class="fb-dropzone" id="dropzone">
            <div class="fb-shots" id="shots">
              <button type="button" class="fb-shot-add" id="addShot">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <circle cx="8.5" cy="10.5" r="1.5"></circle>
                  <path d="M21 15l-5-5L5 19"></path>
                </svg>
                <span>添加截图</span>
              </button>
            </div>
            <div class="fb-drop-tip">支持点击选择、拖拽图片到此区域，或直接 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴截图（PNG / JPG / WebP / GIF）</div>
          </div>
          <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
        </div>

        <div class="fb-field">
          <div class="fb-label-row">
            <label class="fb-label" for="contact">联系方式 <span class="fb-hint">可选，方便回复你</span></label>
          </div>
          <input type="text" class="field" id="contact" maxlength="120" placeholder="OJ 用户名 / 邮箱 / QQ，任选其一" />
        </div>

        <div class="fb-actions">
          <button type="submit" class="btn btn-primary" id="submit">提交反馈</button>
          <span class="fb-msg" id="msg" role="status" aria-live="polite"></span>
          <span class="fb-shortcut"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 提交</span>
        </div>
      </form>

      <div class="fb-done" id="done" hidden>
        <div class="fb-done-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
        </div>
        <h2>已收到，谢谢！</h2>
        <p>我们已记录你的反馈，看过之后会在后续版本里排查和处理。</p>
        <div class="fb-id-row">
          <span>反馈编号</span>
          <code id="doneId"></code>
          <button type="button" class="btn btn-ghost btn-sm" id="copyId">复制</button>
        </div>
        <div class="fb-done-actions">
          <button type="button" class="btn btn-primary" id="again">再提交一条</button>
          <a class="btn btn-ghost" href="../" data-nav="home">返回官网</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="fb-footer">
  <div class="wrap-form fb-footer-inner">
    <span>7FA4 Chat · 意见反馈</span>
    <div class="fb-footer-links">
      <a href="../" data-nav="home">官网首页</a>
      <a href="../web/" data-nav="web">网页版</a>
      <a href="./admin" data-nav="admin">管理后台</a>
    </div>
  </div>
</footer>

<script>
(function () {
  var MAX_SHOTS = 3;
  var MAX_SHOT = 3 * 1024 * 1024;
  var MAX_CONTENT = 4000;
  var shots = [];

  var $ = function (id) { return document.getElementById(id); };
  var contentEl = $('content');
  var countEl = $('count');
  var msgEl = $('msg');
  var submitEl = $('submit');
  var fileEl = $('file');
  var dropzoneEl = $('dropzone');
  var addEl = $('addShot');

  // 站点可能被反代挂在子路径下（例如 /7fa4-chat/feedback），前缀只存在于浏览器侧
  var BASE = location.pathname.replace(/\/feedback(?:\/(?:index\.html)?)?$/, '');
  var submitUrl = BASE + '/api/feedback';

  var brandIcon = $('brandIcon');
  if (brandIcon) brandIcon.src = BASE + '/assets/icon.png';
  document.querySelectorAll('a[data-nav="home"]').forEach(function (a) {
    a.href = (BASE || '') + '/';
  });
  document.querySelectorAll('a[data-nav="web"]').forEach(function (a) {
    a.href = BASE + '/web/';
  });
  document.querySelectorAll('a[data-nav="admin"]').forEach(function (a) {
    a.href = BASE + '/admin';
  });

  // 主题同步：与官网共享 localStorage['7fa4-site-theme']
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var meta = $('themeColorMeta');
    if (meta) meta.setAttribute('content', t === 'light' ? '#f6f7fb' : '#05060a');
  }

  $('themeToggle').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    var next = cur === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('7fa4-site-theme', next); } catch (e) {}
  });

  window.addEventListener('storage', function (e) {
    if (e.key === '7fa4-site-theme' && (e.newValue === 'light' || e.newValue === 'dark')) {
      applyTheme(e.newValue);
    }
  });

  // 展示 URL 携带的客户端版本号（如有）
  var urlParams = new URLSearchParams(location.search);
  var clientVersion = (urlParams.get('version') || '').trim();
  if (clientVersion) {
    var vb = $('versionBadge');
    vb.textContent = '客户端 ' + (/^v/i.test(clientVersion) ? clientVersion : 'v' + clientVersion);
    vb.hidden = false;
  }

  // 自动识别平台：桌面端反馈按钮会带 ?platform=windows 之类；否则按 UA 猜
  function detectPlatform() {
    var p = urlParams.get('platform');
    if (p) return p.toLowerCase();
    var ua = navigator.userAgent;
    if (/Android/i.test(ua)) return 'android';
    if (/Windows/i.test(ua)) return 'windows';
    if (/Linux/i.test(ua) && !/Android/i.test(ua)) return 'linux';
    if (/Mac OS X/i.test(ua)) return 'macos';
    return 'web';
  }
  var detected = detectPlatform();
  var radio = document.querySelector('input[name="platform"][value="' + detected + '"]');
  if (!radio) radio = document.querySelector('input[name="platform"][value="unknown"]');
  if (radio) radio.checked = true;

  function updateCount() {
    var n = contentEl.value.length;
    countEl.textContent = n + '/' + MAX_CONTENT;
    countEl.classList.toggle('warn', n > MAX_CONTENT * 0.9 && n <= MAX_CONTENT);
    countEl.classList.toggle('over', n > MAX_CONTENT);
  }
  contentEl.addEventListener('input', updateCount);

  contentEl.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      $('form').requestSubmit ? $('form').requestSubmit() : $('submit').click();
    }
  });

  addEl.addEventListener('click', function () {
    if (shots.length >= MAX_SHOTS) return;
    fileEl.value = '';
    fileEl.click();
  });

  function addShotFiles(fileList) {
    var list = Array.prototype.slice.call(fileList || []);
    if (!list.length) return;
    var room = MAX_SHOTS - shots.length;
    if (room <= 0) {
      setMsg('最多只能添加 ' + MAX_SHOTS + ' 张截图', true);
      return;
    }
    if (list.length > room) {
      setMsg('最多只能添加 ' + MAX_SHOTS + ' 张截图，已自动截取前 ' + room + ' 张', true);
    }
    list.slice(0, room).forEach(function (f) {
      if (!/^image\/(png|jpeg|webp|gif)$/i.test(f.type)) {
        setMsg('仅支持 PNG / JPG / WebP / GIF 格式图片', true);
        return;
      }
      if (f.size > MAX_SHOT) {
        setMsg('单张截图不能超过 3MB', true);
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        if (shots.length >= MAX_SHOTS) return;
        shots.push({ type: f.type, data: String(reader.result), name: f.name || 'screenshot.png' });
        setMsg('');
        renderShots();
      };
      reader.readAsDataURL(f);
    });
  }

  fileEl.addEventListener('change', function () {
    addShotFiles(fileEl.files);
  });

  var dragDepth = 0;
  dropzoneEl.addEventListener('dragenter', function (e) {
    e.preventDefault();
    dragDepth++;
    dropzoneEl.classList.add('drag-over');
  });
  dropzoneEl.addEventListener('dragover', function (e) {
    e.preventDefault();
  });
  dropzoneEl.addEventListener('dragleave', function (e) {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dropzoneEl.classList.remove('drag-over');
  });
  dropzoneEl.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    dropzoneEl.classList.remove('drag-over');
    if (e.dataTransfer && e.dataTransfer.files) {
      addShotFiles(e.dataTransfer.files);
    }
  });

  document.addEventListener('paste', function (e) {
    var items = Array.prototype.slice.call((e.clipboardData && e.clipboardData.items) || []);
    var imgFiles = items
      .filter(function (it) { return it.kind === 'file' && /^image\//.test(it.type); })
      .map(function (it) { return it.getAsFile(); })
      .filter(Boolean);
    if (!imgFiles.length) return;
    e.preventDefault();
    addShotFiles(imgFiles);
  });

  function showZoom(url, alt) {
    var existing = document.querySelector('.fb-zoom');
    if (existing) existing.remove();
    var z = document.createElement('div');
    z.className = 'fb-zoom';
    z.setAttribute('role', 'dialog');
    z.setAttribute('aria-modal', 'true');
    z.setAttribute('aria-label', alt || '截图预览');
    var img = document.createElement('img');
    img.src = url;
    img.alt = alt || '截图预览';
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'fb-zoom-close';
    closeBtn.textContent = '×';
    closeBtn.setAttribute('aria-label', '关闭预览');
    function close() {
      document.removeEventListener('keydown', onKey);
      z.remove();
    }
    function onKey(ev) {
      if (ev.key === 'Escape') close();
    }
    z.addEventListener('click', function (ev) {
      if (ev.target === z || ev.target === closeBtn) close();
    });
    document.addEventListener('keydown', onKey);
    z.appendChild(img);
    z.appendChild(closeBtn);
    document.body.appendChild(z);
  }

  function renderShots() {
    var box = $('shots');
    box.querySelectorAll('.fb-shot').forEach(function (n) { n.remove(); });
    shots.forEach(function (s, i) {
      var d = document.createElement('div');
      d.className = 'fb-shot';
      var img = document.createElement('img');
      img.src = s.data;
      img.alt = '截图 ' + (i + 1);
      img.title = s.name + '（点击预览）';
      img.addEventListener('click', function () {
        showZoom(s.data, img.alt);
      });
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'fb-shot-del';
      del.textContent = '×';
      del.title = '移除';
      del.setAttribute('aria-label', '移除截图 ' + (i + 1));
      del.addEventListener('click', function (ev) {
        ev.stopPropagation();
        shots.splice(i, 1);
        renderShots();
      });
      d.appendChild(img);
      d.appendChild(del);
      box.insertBefore(d, addEl);
    });
    addEl.style.display = shots.length >= MAX_SHOTS ? 'none' : '';
  }

  function setMsg(text, isErr) {
    msgEl.textContent = text || '';
    msgEl.className = 'fb-msg' + (text ? (isErr ? ' err' : ' ok') : '');
  }

  function fail(text) {
    setMsg(text, true);
    submitEl.disabled = false;
    submitEl.textContent = '提交反馈';
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var content = contentEl.value.trim();
    if (!content) { setMsg('先写点内容吧', true); contentEl.focus(); return; }
    if (content.length > MAX_CONTENT) { setMsg('内容超出 ' + MAX_CONTENT + ' 字', true); return; }

    var checked = document.querySelector('input[name="platform"]:checked');
    var payload = {
      content: content,
      platform: checked ? checked.value : 'unknown',
      contact: $('contact').value.trim(),
      page: location.href,
      version: clientVersion,
      screenshots: shots.map(function (s) { return { type: s.type, data: s.data, name: s.name }; })
    };

    submitEl.disabled = true;
    submitEl.textContent = '提交中…';
    setMsg('');

    var xhr = new XMLHttpRequest();
    xhr.open('POST', submitUrl, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 60000;
    xhr.onload = function () {
      var data = null;
      try { data = JSON.parse(xhr.responseText || '{}'); } catch (err) {}
      if (xhr.status === 200 && data && data.ok) {
        $('doneId').textContent = data.id || '—';
        $('form').hidden = true;
        $('done').hidden = false;
      } else {
        fail((data && data.error) || ('提交失败（HTTP ' + xhr.status + '）'));
      }
    };
    xhr.onerror = function () { fail('网络错误，检查一下连接后重试'); };
    xhr.ontimeout = function () { fail('提交超时，请重试'); };
    xhr.send(JSON.stringify(payload));
  });

  $('copyId').addEventListener('click', function () {
    var idText = $('doneId').textContent;
    if (!idText || idText === '—') return;
    var btn = $('copyId');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(idText).then(function () {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制'; }, 1600);
      }).catch(function () {});
    }
  });

  $('again').addEventListener('click', function () {
    contentEl.value = '';
    updateCount();
    shots = [];
    renderShots();
    $('contact').value = '';
    $('done').hidden = true;
    $('form').hidden = false;
    submitEl.disabled = false;
    submitEl.textContent = '提交反馈';
    setMsg('');
    contentEl.focus();
  });

  contentEl.focus();
})();
</script>
</body>
</html>
