<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#05060a" id="themeColorMeta" />
<title>反馈管理 · 7FA4 Chat</title>
<script>
(function () {
  var theme = null;
  try {
    var qp = new URLSearchParams(location.search).get('theme');
    if (qp === 'light' || qp === 'dark') {
      theme = qp;
    } else {
      var saved = localStorage.getItem('7fa4-site-theme');
      if (saved === 'light' || saved === 'dark') theme = saved;
    }
  } catch (e) {}
  if (!theme) {
    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', theme);
  var meta = document.getElementById('themeColorMeta');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f7fb' : '#05060a');
})();
</script>
<link id="faviconLink" rel="icon" type="image/png" href="../assets/icon.png" />
<link id="tokensCss" rel="stylesheet" href="../tokens.css" />
<script>
(function () {
  var base = location.pathname.replace(/\/feedback\/admin\/?$/, '');
  var tok = document.getElementById('tokensCss');
  var fav = document.getElementById('faviconLink');
  try {
    if (tok && new URL(tok.getAttribute('href'), location.href).pathname !== base + '/tokens.css') {
      tok.href = base + '/tokens.css';
    }
    if (fav && new URL(fav.getAttribute('href'), location.href).pathname !== base + '/assets/icon.png') {
      fav.href = base + '/assets/icon.png';
    }
  } catch (e) {}
})();
</script>
<style>
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .adm-main {
    flex: 1;
    padding: 104px 0 64px;
  }

  /* 登录卡片 */
  .adm-login {
    max-width: 400px;
    margin: 7vh auto 0;
    padding: 30px 28px;
  }

  .adm-login-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .adm-login-head img {
    width: 34px;
    height: 34px;
    border-radius: 10px;
  }

  .adm-login h1 {
    font-size: 21px;
  }

  .adm-login-sub {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .adm-pw-wrap {
    position: relative;
  }

  .adm-pw-wrap .field {
    padding-right: 60px;
  }

  .adm-pw-toggle {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    height: 30px;
    padding: 0 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }

  .adm-pw-toggle:hover {
    color: var(--ink);
    background: color-mix(in srgb, var(--ink) 8%, transparent);
  }

  .adm-login-actions {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .adm-login-msg {
    font-size: 13px;
    color: var(--danger);
    min-height: 20px;
  }

  /* 控制台顶栏 */
  .adm-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .adm-title-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .adm-bar h1 {
    font-size: 24px;
  }

  .adm-stats {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .adm-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
    justify-content: flex-end;
    min-width: 260px;
  }

  .adm-search {
    width: min(100%, 280px);
    padding: 8px 14px;
    font-size: 13.5px;
    border-radius: 999px;
  }

  /* 标签过滤栏 */
  .adm-tabs {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--ink) 5%, transparent);
    border: 1px solid var(--line);
    margin-bottom: 18px;
  }

  .adm-tabs button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 14px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color .16s var(--ease), color .16s var(--ease);
  }

  .adm-tabs button:hover {
    color: var(--ink);
  }

  .adm-tabs button.on {
    background: color-mix(in srgb, var(--accent) 18%, var(--panel-solid));
    color: var(--ink);
    font-weight: 600;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);
  }

  [data-theme="light"] .adm-tabs button.on {
    background: #ffffff;
    box-shadow: 0 2px 8px rgba(14, 20, 40, .08);
  }

  .adm-tab-num {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* 反馈列表 */
  .adm-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .item {
    padding: 20px 22px;
    border-left: 3px solid var(--line-strong);
    transition: border-color .18s var(--ease), opacity .18s var(--ease);
  }

  .item.is-new {
    border-left-color: var(--accent);
  }

  .item.is-handled {
    opacity: 0.76;
    border-left-color: var(--ok-line);
  }

  .item.is-handled:hover {
    opacity: 0.96;
  }

  .item-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .item-head time {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .adm-content {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink);
    margin: 0 0 12px;
  }

  .adm-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 12px;
    padding: 8px 12px;
    border-radius: 11px;
    background: color-mix(in srgb, var(--bg) 52%, transparent);
    border: 1px solid var(--line);
  }

  .adm-meta span {
    word-break: break-all;
  }

  .adm-shots {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }

  .adm-shots a {
    display: block;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    background: var(--panel-solid);
    transition: transform .18s var(--ease), border-color .18s var(--ease);
  }

  .adm-shots a:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }

  .adm-shots img {
    width: 104px;
    height: 104px;
    object-fit: cover;
    display: block;
    cursor: zoom-in;
  }

  .item-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .item-foot .id {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    user-select: all;
  }

  .adm-empty {
    text-align: center;
    padding: 56px 24px;
    color: var(--muted);
    font-size: 14.5px;
  }

  .adm-empty svg {
    width: 34px;
    height: 34px;
    stroke: var(--faint);
    fill: none;
    stroke-width: 1.6;
    margin-bottom: 10px;
  }

  /* 灯箱 */
  .zoom {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: rgba(5, 6, 10, 0.86);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }

  .zoom img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 14px;
    box-shadow: 0 28px 70px rgba(0, 0, 0, .65);
    cursor: default;
  }

  .zoom-close {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .24);
    background: rgba(13, 16, 25, .78);
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
  }

  .zoom-close:hover {
    background: rgba(13, 16, 25, .96);
  }

  /* 页脚 */
  .adm-footer {
    border-top: 1px solid var(--line);
    padding: 24px 0 34px;
    color: var(--muted);
    font-size: 13.5px;
  }

  .adm-footer-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .adm-footer-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px;
  }

  .adm-footer-links a:hover {
    color: var(--ink);
  }

  @media (max-width: 640px) {
    .adm-main {
      padding: 88px 0 44px;
    }
    .adm-login {
      margin-top: 4vh;
      padding: 22px 20px;
    }
    .adm-controls {
      width: 100%;
      justify-content: flex-start;
    }
    .adm-search {
      width: 100%;
      flex: 1 1 100%;
    }
    .item {
      padding: 16px;
    }
    .item-head time {
      margin-left: 0;
      width: 100%;
    }
    .topbar-inner {
      padding: 8px 10px 8px 14px;
      gap: 8px;
    }
    .brand-tag {
      display: none;
    }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true">
  <span class="aurora-a"></span>
  <span class="aurora-b"></span>
  <span class="aurora-c"></span>
</div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="../" data-nav="home">
      <img class="brand-mark" id="brandIcon" src="../assets/icon.png" alt="7FA4 Chat" width="28" height="28" />
      <span class="brand-name">7FA4 <span class="brand-light">Chat</span></span>
      <span class="brand-tag">反馈管理</span>
    </a>
    <div class="topbar-side">
      <button type="button" class="icon-btn" id="themeToggle" aria-label="切换浅色/深色主题" title="切换主题">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
        </svg>
      </button>
      <a class="btn btn-ghost btn-sm" href="./" data-nav="feedback">提交页</a>
      <a class="btn btn-ghost btn-sm" href="../" data-nav="home">返回官网</a>
    </div>
  </div>
</header>

<main class="adm-main">
  <div class="wrap">
    <section class="glass-card adm-login" id="login" hidden>
      <div class="adm-login-head">
        <img id="loginIcon" src="../assets/icon.png" alt="" width="34" height="34" />
        <h1>反馈管理</h1>
      </div>
      <p class="adm-login-sub">需要管理密码才能查看全部反馈与截图附件。</p>
      <form id="loginForm">
        <div class="adm-pw-wrap">
          <input type="password" class="field" id="password" placeholder="管理密码" autocomplete="current-password" />
          <button type="button" class="adm-pw-toggle" id="pwToggle" aria-label="显示密码">显示</button>
        </div>
        <div class="adm-login-actions">
          <button type="submit" class="btn btn-primary btn-sm" id="loginBtn">进入</button>
          <span class="adm-login-msg" id="loginMsg" role="alert"></span>
        </div>
      </form>
    </section>

    <section id="panel" hidden>
      <div class="adm-bar">
        <div class="adm-title-group">
          <h1>用户反馈</h1>
          <div class="adm-stats">
            <span class="pill">全部 <b id="statTotal">0</b></span>
            <span class="tag tag-danger">待处理 <b id="statNew">0</b></span>
            <span class="tag tag-ok">已处理 <b id="statHandled">0</b></span>
          </div>
        </div>
        <div class="adm-controls">
          <input type="search" class="field adm-search" id="q" placeholder="搜索内容 / 联系方式 / 编号" aria-label="搜索反馈" />
          <button type="button" class="btn btn-ghost btn-sm" id="reload">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            刷新
          </button>
          <button type="button" class="btn btn-ghost btn-sm" id="logout">退出</button>
        </div>
      </div>

      <div class="adm-tabs" role="tablist" aria-label="状态筛选">
        <button type="button" data-tab="all" class="on" role="tab" aria-selected="true">全部 <span class="adm-tab-num" id="tabAllCount">0</span></button>
        <button type="button" data-tab="new" role="tab" aria-selected="false">待处理 <span class="adm-tab-num" id="tabNewCount">0</span></button>
        <button type="button" data-tab="handled" role="tab" aria-selected="false">已处理 <span class="adm-tab-num" id="tabHandledCount">0</span></button>
      </div>

      <div class="adm-list" id="list"></div>
      <div class="glass-card adm-empty" id="empty" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <div>没有符合条件的反馈</div>
      </div>
    </section>
  </div>
</main>

<footer class="adm-footer">
  <div class="wrap adm-footer-inner">
    <span>7FA4 Chat · 反馈管理</span>
    <div class="adm-footer-links">
      <a href="../" data-nav="home">官网首页</a>
      <a href="./" data-nav="feedback">反馈提交页</a>
    </div>
  </div>
</footer>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var items = [];
  var tab = 'all';
  var query = '';

  // 站点可能被反代挂在子路径下（例如 /7fa4-chat/feedback/admin），
  // 前缀只存在于浏览器侧，必须由页面自己算出来再拼接口地址。
  var BASE = location.pathname.replace(/\/feedback\/admin\/?$/, '');

  var brandIcon = $('brandIcon');
  var loginIcon = $('loginIcon');
  if (brandIcon) brandIcon.src = BASE + '/assets/icon.png';
  if (loginIcon) loginIcon.src = BASE + '/assets/icon.png';
  document.querySelectorAll('a[data-nav="home"]').forEach(function (a) {
    a.href = (BASE || '') + '/';
  });
  document.querySelectorAll('a[data-nav="feedback"]').forEach(function (a) {
    a.href = BASE + '/feedback/';
  });

  // 主题同步：与官网共享 localStorage['7fa4-site-theme']
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var meta = $('themeColorMeta');
    if (meta) meta.setAttribute('content', t === 'light' ? '#f6f7fb' : '#05060a');
  }

  $('themeToggle').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    var next = cur === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('7fa4-site-theme', next); } catch (e) {}
  });

  window.addEventListener('storage', function (e) {
    if (e.key === '7fa4-site-theme' && (e.newValue === 'light' || e.newValue === 'dark')) {
      applyTheme(e.newValue);
    }
  });

  // 密码显示切换
  $('pwToggle').addEventListener('click', function () {
    var pw = $('password');
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    $('pwToggle').textContent = show ? '隐藏' : '显示';
    $('pwToggle').setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
  });

  function absolute(path) {
    return path && path.charAt(0) === '/' ? BASE + path : path;
  }

  function api(path, opts) {
    return fetch(BASE + '/api/feedback/admin' + path, Object.assign({ credentials: 'same-origin' }, opts || {}))
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (data) {
          return { status: r.status, data: data };
        });
      });
  }

  function platformLabel(p) {
    var map = { windows: 'Windows', linux: 'Linux', web: '网页版', macos: 'macOS', android: 'Android', unknown: '未知' };
    return map[p] || p || '未知';
  }

  function fmtTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso || '';
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    var q = query.trim().toLowerCase();
    var newCount = items.filter(function (it) { return it.status !== 'handled'; }).length;
    var handledCount = items.length - newCount;

    var shown = items.filter(function (it) {
      if (tab === 'new' && it.status === 'handled') return false;
      if (tab === 'handled' && it.status !== 'handled') return false;
      if (!q) return true;
      return (it.content + ' ' + (it.contact || '') + ' ' + it.id).toLowerCase().indexOf(q) >= 0;
    });

    $('statTotal').textContent = items.length;
    $('statNew').textContent = newCount;
    $('statHandled').textContent = handledCount;
    $('tabAllCount').textContent = items.length;
    $('tabNewCount').textContent = newCount;
    $('tabHandledCount').textContent = handledCount;
    $('empty').hidden = shown.length > 0;

    var list = $('list');
    list.innerHTML = '';
    shown.forEach(function (it) {
      var el = document.createElement('article');
      var isHandled = it.status === 'handled';
      el.className = 'glass-card item ' + (isHandled ? 'is-handled' : 'is-new');

      var shots = (it.attachments || []).map(function (a) {
        var src = absolute(a.url);
        return '<a href="' + esc(src) + '" data-zoom="' + esc(src) + '"><img src="' + esc(src) +
          '" alt="' + esc(a.name || '截图') + '" loading="lazy" /></a>';
      }).join('');

      var metaBits = [];
      if (it.version) metaBits.push('版本 ' + esc(it.version));
      if (it.contact) metaBits.push('联系 ' + esc(it.contact));
      if (it.page) metaBits.push('来源 ' + esc(it.page));
      if (it.ip) metaBits.push('IP ' + esc(it.ip));

      el.innerHTML =
        '<div class="item-head">' +
          '<span class="tag tag-accent">' + esc(platformLabel(it.platform)) + '</span>' +
          '<span class="tag ' + (isHandled ? 'tag-ok' : 'tag-danger') + '">' +
            (isHandled ? '已处理' : '待处理') + '</span>' +
          '<time>' + esc(fmtTime(it.createdAt)) + '</time>' +
        '</div>' +
        '<p class="adm-content">' + esc(it.content) + '</p>' +
        (metaBits.length ? '<div class="adm-meta">' + metaBits.map(function (m) { return '<span>' + m + '</span>'; }).join('') + '</div>' : '') +
        (shots ? '<div class="adm-shots">' + shots + '</div>' : '') +
        '<div class="item-foot">' +
          '<button type="button" class="btn btn-ghost btn-sm" data-toggle="' + esc(it.id) + '" data-to="' + (isHandled ? 'new' : 'handled') + '">' +
            (isHandled ? '标记待处理' : '标记已处理') + '</button>' +
          '<span class="id">' + esc(it.id) + '</span>' +
        '</div>';

      list.appendChild(el);
    });
  }

  function load() {
    var reloadBtn = $('reload');
    if (reloadBtn) reloadBtn.disabled = true;
    return api('/list').then(function (r) {
      if (reloadBtn) reloadBtn.disabled = false;
      if (r.status === 401) {
        $('panel').hidden = true;
        $('login').hidden = false;
        return;
      }
      items = (r.data && r.data.items) || [];
      $('login').hidden = true;
      $('panel').hidden = false;
      render();
    }).catch(function () {
      if (reloadBtn) reloadBtn.disabled = false;
    });
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    $('loginMsg').textContent = '';
    $('loginBtn').disabled = true;
    api('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('password').value })
    }).then(function (r) {
      $('loginBtn').disabled = false;
      if (r.status === 200) {
        $('password').value = '';
        load();
      } else {
        $('loginMsg').textContent = (r.data && r.data.error) || '登录失败';
      }
    }).catch(function () {
      $('loginBtn').disabled = false;
      $('loginMsg').textContent = '网络错误，请稍后重试';
    });
  });

  document.querySelectorAll('.adm-tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      tab = b.dataset.tab;
      document.querySelectorAll('.adm-tabs button').forEach(function (x) {
        var active = x === b;
        x.classList.toggle('on', active);
        x.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      render();
    });
  });

  $('q').addEventListener('input', function () {
    query = $('q').value;
    render();
  });

  $('reload').addEventListener('click', load);

  $('logout').addEventListener('click', function () {
    api('/logout', { method: 'POST' }).then(function () {
      items = [];
      $('panel').hidden = true;
      $('login').hidden = false;
    });
  });

  $('list').addEventListener('click', function (e) {
    var zoom = e.target.closest('[data-zoom]');
    if (zoom) {
      e.preventDefault();
      showZoom(zoom.dataset.zoom);
      return;
    }
    var toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      var id = toggle.dataset.toggle;
      toggle.disabled = true;
      api('/status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, status: toggle.dataset.to })
      }).then(function (r) {
        toggle.disabled = false;
        if (r.status === 200) {
          var it = items.find(function (x) { return x.id === id; });
          if (it) it.status = toggle.dataset.to;
          render();
        }
      }).catch(function () {
        toggle.disabled = false;
      });
      return;
    }
  });

  function showZoom(url) {
    var existing = document.querySelector('.zoom');
    if (existing) existing.remove();
    var z = document.createElement('div');
    z.className = 'zoom';
    z.setAttribute('role', 'dialog');
    z.setAttribute('aria-modal', 'true');
    z.setAttribute('aria-label', '截图大图预览');
    var img = document.createElement('img');
    img.src = url;
    img.alt = '反馈截图大图';
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'zoom-close';
    closeBtn.textContent = '×';
    closeBtn.setAttribute('aria-label', '关闭大图');
    function close() {
      document.removeEventListener('keydown', onKey);
      z.remove();
    }
    function onKey(ev) {
      if (ev.key === 'Escape') close();
    }
    z.addEventListener('click', function (ev) {
      if (ev.target === z || ev.target === closeBtn) close();
    });
    document.addEventListener('keydown', onKey);
    z.appendChild(img);
    z.appendChild(closeBtn);
    document.body.appendChild(z);
  }

  load();
})();
</script>
</body>
</html>
