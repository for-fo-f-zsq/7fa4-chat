name: Build & Release

# 触发方式：
#   1. 推送形如 v4.0.0 的 tag -> 打包并发布：
#        - GitHub Releases：保留全部历史版本（每个 tag 一个 Release，附全部构建产物）
#        - GitLab（项目 886）：只保留最新一版 generic 包（latest/，先上传安装包→再上传元数据→校验→再清理旧包），
#          并自动创建/更新 Release
#   2. 手动触发 (workflow_dispatch) -> 仅打包，产物在本次 Actions run 的 Artifacts 中下载
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read    # 默认只读；仅 release job 提升为 write

jobs:
  # ============ 前置门禁：10 秒内校验版本号与 CHANGELOG，失败立即拦截 ============
  # 避免忘记改 package.json 或漏写 CHANGELOG 段落时，空跑完四平台编译（15+ 分钟）才在 release 阶段报错。
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve & validate version and CHANGELOG
        id: meta
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ -z "$VERSION" ]; then
              echo "::error::无法从 tag ${GITHUB_REF_NAME} 解析版本号"
              exit 1
            fi
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "::error::package.json version ($PKG_VERSION) 与 tag 版本 ($VERSION) 不一致"
              exit 1
            fi
            node scripts/release/build-release-body.mjs "$VERSION" > /dev/null
            echo "前置校验通过：version=$VERSION（package.json 与 CHANGELOG 均匹配）"
          else
            VERSION="$PKG_VERSION"
            echo "手动构建：version=$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ============ 单测门禁：阻止失败测试的产物发布 ============
  test:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run tests
        run: npm test

  # ============ 构建：Windows (x64/arm64 拆分) / Linux / macOS 并行 ============
  build:
    needs: preflight
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            eb_args: --win --x64
            artifact: dist-win-x64
            win_arch: x64
          - os: windows-latest
            platform: win
            eb_args: --win --arm64
            artifact: dist-win-arm64
            win_arch: arm64
          - os: ubuntu-latest
            platform: linux
            eb_args: --linux
            artifact: dist-linux
            win_arch: ''
          - os: macos-latest
            platform: mac
            eb_args: --mac
            artifact: dist-mac
            win_arch: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & main (electron-vite)
        run: npm run build
        env:
          # renderer 依赖体积较大（Font Awesome / KaTeX / Prism / GeoGebra），默认 2GB 堆不够（mac/Linux runner 曾 OOM），放大堆上限
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/eb-cache
          key: eb-${{ runner.os }}-${{ matrix.win_arch || matrix.platform }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            eb-${{ runner.os }}-${{ matrix.win_arch || matrix.platform }}-
            eb-${{ runner.os }}-

      - name: Package (${{ matrix.artifact }})
        run: npx electron-builder ${{ matrix.eb_args }} --publish never
        env:
          # 走直连拉取 electron / fpm / nsis 等二进制（GitHub runner 外网通畅）
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache

      - name: Rename Windows manifest for parallel merge
        if: matrix.win_arch != ''
        shell: bash
        run: |
          if [ -f build/latest.yml ]; then
            mv build/latest.yml "build/latest-win-${{ matrix.win_arch }}.yml"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            build/*.exe
            build/*.zip
            build/*.AppImage
            build/*.deb
            build/*.dmg
            build/*.yml
            !build/builder-debug.yml

  # ============ 构建：Android（Capacitor，复用同一渲染层）============
  build-android:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 7 插件源码要求 JDK 21 工具链编译
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 注：不再使用 android-actions/setup-android@v3
      #   该 action 内部执行 `sdkmanager tools`，而新版 Android SDK 仓库已下线 `tools` 包
      #   → 恒报 "Failed to find package 'tools'" 并以 exit 1 中断（2026-09-18 起）。
      #   ubuntu runner 已预装 cmdline-tools / platform-tools，直接使用即可。
      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then echo "::error::未找到 Android SDK: $SDK"; exit 1; fi
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKMGR" ]; then echo "::error::未找到 sdkmanager"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDK=$SDK"
          echo "sdkmanager=$SDKMGR"
          "$SDKMGR" --version

      - name: Install SDK components
        run: |
          # 接受许可后安装工程所需组件（compileSdk 35）；已安装时秒过
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Android renderer assets
        run: npm run build:android:assets
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # if 表达式不支持 secrets 上下文，改为在 step 内判断是否配置了签名密钥
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "已解码签名密钥 android/app/release.keystore"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_B64，将使用 debug 签名（跨机器升级安装会失败）"
          fi

      - name: Build APK
        working-directory: android
        run: |
          if [ -f app/release.keystore ]; then
            echo "使用 release 签名构建"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_B64 等 Secrets，使用 debug 签名（可安装，但后续版本换签名后无法覆盖升级）"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION="${{ needs.preflight.outputs.version }}"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/7FA4-Chat-${VERSION}-android.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          if-no-files-found: error
          retention-days: 7
          path: android/app/build/outputs/apk/release/*.apk

  # ============ 并行发布：GitHub Release + 自建 GitLab（仅在 tag 推送时执行）============
  # GitHub Release (~16s) 与 GitLab 上传并发执行，互不阻塞。
  # 工具包已由 tools.yml 独占构建与发布，此处不再重复运行 build-tools。
  release-github:
    needs: [preflight, test, build, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    concurrency:
      group: release-github-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build release body (Markdown)
        run: |
          set -euo pipefail
          node scripts/release/build-release-body.mjs "$VERSION" > release-body.md
          echo "--- release-body.md ---"
          cat release-body.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Merge Windows manifests
        run: node scripts/release/merge-win-yml.mjs --dir dist --version "$VERSION"

      - name: List collected files
        run: ls -la dist

      - name: Validate release upload plan (dry-run)
        run: node scripts/release/publish-gitlab.mjs --version "$VERSION"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.yml
            dist/*.apk

  release-gitlab:
    needs: [preflight, test, build, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: release-gitlab-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build release body (Markdown)
        run: |
          set -euo pipefail
          node scripts/release/build-release-body.mjs "$VERSION" > release-body.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Merge Windows manifests
        run: node scripts/release/merge-win-yml.mjs --dir dist --version "$VERSION"

      - name: Validate release upload plan (dry-run)
        run: node scripts/release/publish-gitlab.mjs --version "$VERSION"

      # ---- 自建 GitLab：先并发传安装包→再传元数据→校验→再清理旧包与旧链接→重建 Release ----
      # 逻辑已收敛至 scripts/release/publish-gitlab.mjs（复用 release-assets.mjs，支持本地 --dry-run 与单测）。
      - name: Publish to GitLab (only latest package + release)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_API: https://jx.7fa4.cn:9080/api/v4/projects/886
          GITLAB_REF: master
          PACKAGE_NAME: 7FA4-Chat
          DIST_DIR: dist
          CHANGELOG_FILE: CHANGELOG
          RELEASE_BODY_FILE: release-body.md
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "::error::缺少 secret GITLAB_TOKEN，请在仓库 Settings→Secrets→Actions 添加后重试"
            exit 1
          fi
          node scripts/release/publish-gitlab.mjs --apply

      # ---- 只读收尾核对：TOOLS 清单、官网 /api/downloads（含缓存等待）与 Actions 摘要 ----
      - name: Verify published endpoints & write summary
        continue-on-error: true
        env:
          DIST_DIR: dist
        run: node scripts/release/verify-release.mjs
